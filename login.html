<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F172A">
    <title>Login - All In One Grow</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AIO Grow">
    
    <style>
        :root {
            --color-dark: #0F172A;
            --color-darker: #020617;
            --color-primary: #3B82F6;
            --color-primary-light: #60A5FA;
            --color-accent: #10B981;
            --color-accent-glow: #34D399;
            --color-text: #E2E8F0;
            --color-text-dim: #94A3B8;
            --color-error: #EF4444;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Work Sans', sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--color-darker);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Animated Background */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, var(--color-darker) 0%, var(--color-dark) 50%, #1E293B 100%);
        }
        
        .bg-animated::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
            border-radius: 50%;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.1); }
        }
        
        /* Container */
        .container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            animation: fadeInUp 1s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-text {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        
        .logo-subtitle {
            color: var(--color-text-dim);
            font-size: 0.95rem;
        }
        
        /* Login Card */
        .login-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        
        .login-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            color: var(--color-text);
        }
        
        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            color: var(--color-text);
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        .form-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: rgba(15, 23, 42, 0.8);
        }
        
        .form-input.error {
            border-color: var(--color-error);
        }
        
        .error-message {
            color: var(--color-error);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        /* Buttons */
        .btn {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
            margin-bottom: 1rem;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.6);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Divider */
        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(148, 163, 184, 0.3);
        }
        
        .divider-text {
            position: relative;
            background: rgba(30, 41, 59, 0.6);
            padding: 0 1rem;
            color: var(--color-text-dim);
            font-size: 0.9rem;
        }
        
        /* Link */
        .register-link {
            text-align: center;
            color: var(--color-text-dim);
            font-size: 0.95rem;
        }
        
        .register-link a {
            color: var(--color-primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .register-link a:hover {
            color: var(--color-accent);
        }
        
        /* Loading */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            
            .login-card {
                padding: 2rem 1.5rem;
            }
            
            .logo-text {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animated"></div>
    
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <h1 class="logo-text">ALL IN ONE GROW</h1>
            <p class="logo-subtitle">Tu Coach Personal de Crecimiento</p>
        </div>
        
        <!-- Login Card -->
        <div class="login-card">
            <h2 class="login-title">Iniciar Sesión</h2>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input 
                        type="email" 
                        class="form-input" 
                        id="email"
                        placeholder="tu@email.com"
                        required
                    >
                    <p class="error-message" id="emailError">Email inválido</p>
                </div>
                
                <!-- Password -->
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input 
                        type="password" 
                        class="form-input" 
                        id="password"
                        placeholder="••••••••"
                        required
                    >
                    <p class="error-message" id="passwordError">Contraseña incorrecta</p>
                </div>
                
                <!-- Error General -->
                <p class="error-message" id="generalError" style="text-align: center; margin-bottom: 1rem;"></p>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>
            
            <!-- Divider -->
            <div class="divider">
                <span class="divider-text">¿No tienes cuenta?</span>
            </div>
            
            <!-- Register Link -->
            <div class="register-link">
                <a href="registro.html">Crear cuenta nueva</a>
            </div>
        </div>
    </div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>
    
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwuSntFBL1Fm0iySQs-yYqN9oIu7WWYeng2Qm3ZJMG6m4FJRF4jm3UpF2HASIoNriG35g/exec';
        
        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const userId = localStorage.getItem('aio_userId');
            const isLoggedIn = localStorage.getItem('aio_isLoggedIn');
            
            if (userId && isLoggedIn === 'true') {
                // Ya está logueado, redirigir al dashboard
                window.location.href = 'dashboard.html';
            }
        });
        
        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            // Clear previous errors
            clearErrors();
            
            // Validate
            if (!email || !password) {
                showError('generalError', 'Por favor completa todos los campos');
                return;
            }
            
            // Show loading
            loginBtn.disabled = true;
            loginBtn.textContent = 'Iniciando sesión...';
            loadingOverlay.classList.add('show');
            
            try {
                // Call API
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: JSON.stringify({
                        action: 'login',
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Login exitoso
                    localStorage.setItem('aio_userId', data.userId);
                    localStorage.setItem('aio_userName', data.nombreCompleto);
                    localStorage.setItem('aio_userEmail', data.email);
                    localStorage.setItem('aio_isLoggedIn', 'true');
                    
                    // Cargar datos del usuario
                    await cargarDatosUsuario(data.userId);
                    
                    // Redirigir al dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    // Error de login
                    if (data.message.includes('Contraseña')) {
                        showError('passwordError', data.message);
                        document.getElementById('password').classList.add('error');
                    } else if (data.message.includes('registrado')) {
                        showError('generalError', 'Este email no está registrado. ¿Quieres crear una cuenta?');
                    } else {
                        showError('generalError', data.message);
                    }
                }
                
            } catch (error) {
                console.error('Error:', error);
                showError('generalError', 'Error de conexión. Intenta nuevamente.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar Sesión';
                loadingOverlay.classList.remove('show');
            }
        }
        
        // Cargar datos del usuario
        async function cargarDatosUsuario(userId) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: JSON.stringify({
                        action: 'obtenerDatosCompletos',
                        userId: userId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Guardar metas en localStorage
                    if (data.metas && data.metas.length > 0) {
                        localStorage.setItem('aio_metas', JSON.stringify(data.metas));
                    }
                }
            } catch (error) {
                console.error('Error cargando datos:', error);
            }
        }
        
        // Show error
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }
        
        // Clear errors
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
            });
            document.querySelectorAll('.form-input').forEach(el => {
                el.classList.remove('error');
            });
        }
    </script>
    
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registrado:', reg.scope))
                    .catch(err => console.log('Error al registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
