<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F172A">
    <title>Dashboard - All In One Grow</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-dark: #0F172A;
            --color-darker: #020617;
            --color-primary: #3B82F6;
            --color-primary-light: #60A5FA;
            --color-accent: #10B981;
            --color-accent-glow: #34D399;
            --color-warning: #F59E0B;
            --color-text: #E2E8F0;
            --color-text-dim: #94A3B8;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Work Sans', sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--color-darker);
            color: var(--color-text);
            min-height: 100vh;
        }
        
        /* Animated Background */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, var(--color-darker) 0%, var(--color-dark) 50%, #1E293B 100%);
        }
        
        .bg-animated::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
            border-radius: 50%;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.1); }
        }
        
        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            animation: slideDown 0.8s ease-out;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header-date {
            color: var(--color-text-dim);
            font-size: 0.9rem;
        }
        
        /* Welcome Section */
        .welcome-section {
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .greeting {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--color-primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Quote of the Day */
        .quote-card {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--color-accent);
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out 0.2s both;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .quote-text {
            font-size: 1.3rem;
            font-style: italic;
            color: var(--color-text);
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        
        .quote-author {
            color: var(--color-accent-glow);
            font-weight: 600;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        
        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            animation: fadeInUp 1s ease-out 0.4s both;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--color-primary);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.2);
        }
        
        .stat-number {
            font-size: 3rem;
            font-weight: 900;
            font-family: var(--font-display);
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            color: var(--color-text-dim);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        
        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        
        /* Goals Section */
        .goals-section {
            animation: fadeInUp 1s ease-out 0.6s both;
        }
        
        .section-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--color-primary-light);
        }
        
        .goals-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .goal-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .goal-card:hover {
            border-color: var(--color-primary);
            transform: translateX(5px);
        }
        
        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        
        .goal-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--color-text);
        }
        
        .goal-category {
            padding: 0.3rem 0.8rem;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--color-primary-light);
        }
        
        .goal-progress {
            margin-top: 1rem;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        .progress-text {
            font-size: 0.85rem;
            color: var(--color-text-dim);
        }
        
        /* Sidebar */
        .sidebar {
            animation: fadeInUp 1s ease-out 0.8s both;
        }
        
        /* Quick Actions */
        .quick-actions {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .action-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }
        
        .action-btn.secondary {
            background: rgba(148, 163, 184, 0.2);
            border: 2px solid var(--color-text-dim);
            color: var(--color-text);
        }
        
        .action-btn.secondary:hover {
            background: rgba(148, 163, 184, 0.3);
        }
        
        /* Streak Card */
        .streak-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(59, 130, 246, 0.2));
            border: 1px solid var(--color-accent);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }
        
        .streak-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .streak-number {
            font-size: 3rem;
            font-weight: 900;
            font-family: var(--font-display);
            color: var(--color-accent-glow);
        }
        
        .streak-label {
            color: var(--color-text);
            margin-top: 0.5rem;
        }
        
        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--color-text-dim);
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 16px;
            border: 2px dashed rgba(59, 130, 246, 0.3);
        }
        
        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .empty-text {
            color: var(--color-text-dim);
            margin-bottom: 1.5rem;
        }
        
        /* Responsive */
        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            
            .greeting {
                font-size: 2rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animated"></div>
    
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">ALL IN ONE GROW</h1>
            <div class="header-date" id="currentDate">Cargando...</div>
        </header>
        
        <!-- Welcome Section -->
        <div class="welcome-section">
            <h2 class="greeting" id="greeting">Cargando...</h2>
        </div>
        
        <!-- Quote of the Day -->
        <div class="quote-card" id="quoteCard">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Cargando frase del día...</p>
            </div>
        </div>
        
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="statMetas">0</div>
                <div class="stat-label">Metas Activas</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-number" id="statObjetivos">0</div>
                <div class="stat-label">Objetivos Hoy</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-number" id="statCompletados">0</div>
                <div class="stat-label">Completados Hoy</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-number" id="statPorcentaje">0%</div>
                <div class="stat-label">Progreso</div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Goals Section -->
            <div class="goals-section">
                <h3 class="section-title">🎯 Tus Metas del Año</h3>
                <div class="goals-list" id="goalsList">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Cargando tus metas...</p>
                    </div>
                </div>
            </div>
            
            <!-- Sidebar -->
            <div class="sidebar">
                <!-- Quick Actions -->
                <div class="quick-actions">
                    <h3 class="section-title">Acciones Rápidas</h3>
                    <button class="action-btn" onclick="registrarProgreso()">
                        ✅ Registrar lo que hice hoy
                    </button>
                    <button class="action-btn secondary" onclick="verReporte()">
                        📊 Ver mi progreso
                    </button>
                    <button class="action-btn secondary" onclick="configurarMetas()">
                        ⚙️ Configurar metas
                    </button>
                </div>
                
                <!-- Streak -->
                <div class="streak-card">
                    <div class="streak-icon">🔥</div>
                    <div class="streak-number" id="streakDays">0</div>
                    <div class="streak-label">Días seguidos cumpliendo</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwuSntFBL1Fm0iySQs-yYqN9oIu7WWYeng2Qm3ZJMG6m4FJRF4jm3UpF2HASIoNriG35g/exec';
        
        // Get user data
        const userId = localStorage.getItem('aio_userId');
        const userName = localStorage.getItem('aio_userName') || 'Usuario';
        
        // Verificar si está registrado
        if (!userId) {
            alert('No has completado tu registro. Serás redirigido.');
            window.location.href = 'registro.html';
        }
        
        // Initialize
        window.addEventListener('DOMContentLoaded', async () => {
            setDate();
            setGreeting();
            await loadQuoteOfDay();
            await loadUserGoals();
        });
        
        // Set current date
        function setDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date();
            document.getElementById('currentDate').textContent = today.toLocaleDateString('es-ES', options);
        }
        
        // Set greeting based on time
        function setGreeting() {
            const hour = new Date().getHours();
            let greeting = '';
            
            if (hour < 12) {
                greeting = '☀️ Buenos días';
            } else if (hour < 18) {
                greeting = '🌤️ Buenas tardes';
            } else {
                greeting = '🌙 Buenas noches';
            }
            
            const firstName = userName.split(' ')[0];
            document.getElementById('greeting').textContent = `${greeting}, ${firstName}`;
        }
        
        // Load quote of the day
        async function loadQuoteOfDay() {
            const quoteCard = document.getElementById('quoteCard');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: JSON.stringify({
                        action: 'obtenerFraseDia'
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.frase) {
                    quoteCard.innerHTML = `
                        <p class="quote-text">"${data.frase.texto}"</p>
                        <p class="quote-author">— ${data.frase.autor}</p>
                    `;
                } else {
                    throw new Error('No se pudo cargar la frase');
                }
            } catch (error) {
                console.error('Error cargando frase:', error);
                quoteCard.innerHTML = `
                    <p class="quote-text">"El primer paso es siempre el más importante. Hoy comienzas tu transformación."</p>
                    <p class="quote-author">— All In One Grow</p>
                `;
            }
        }
        
        // Load user goals
        async function loadUserGoals() {
            const goalsList = document.getElementById('goalsList');
            
            try {
                // Primero intentar desde localStorage
                const localMetas = localStorage.getItem('aio_metas');
                
                if (localMetas) {
                    const metas = JSON.parse(localMetas);
                    renderGoals(metas);
                    updateStats(metas.length, 0, 0);
                } else {
                    // Si no hay en localStorage, buscar en Google Sheets
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'text/plain',
                        },
                        body: JSON.stringify({
                            action: 'obtenerMetasUsuario',
                            userId: userId,
                            año: new Date().getFullYear()
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success && data.metas && data.metas.length > 0) {
                        renderGoals(data.metas);
                        updateStats(data.metas.length, 0, 0);
                    } else {
                        showEmptyState();
                    }
                }
            } catch (error) {
                console.error('Error cargando metas:', error);
                showEmptyState();
            }
        }
        
        // Render goals
        function renderGoals(metas) {
            const goalsList = document.getElementById('goalsList');
            
            if (!metas || metas.length === 0) {
                showEmptyState();
                return;
            }
            
            goalsList.innerHTML = metas.map((meta, index) => `
                <div class="goal-card" style="animation-delay: ${index * 0.1}s">
                    <div class="goal-header">
                        <h4 class="goal-name">${meta.nombre}</h4>
                        <span class="goal-category">${getCategoryEmoji(meta.categoria)} ${getCategoryName(meta.categoria)}</span>
                    </div>
                    <p style="color: var(--color-text-dim); font-size: 0.9rem; margin-bottom: 1rem;">
                        ${meta.descripcion || 'Sin descripción'}
                    </p>
                    <div class="goal-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.random() * 100}%"></div>
                        </div>
                        <p class="progress-text">Progreso del mes: En desarrollo...</p>
                    </div>
                </div>
            `).join('');
        }
        
        // Show empty state
        function showEmptyState() {
            const goalsList = document.getElementById('goalsList');
            goalsList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🎯</div>
                    <p class="empty-text">Aún no has definido tus metas para este año.</p>
                    <button class="action-btn" onclick="configurarMetas()">
                        Crear mis primeras metas
                    </button>
                </div>
            `;
        }
        
        // Update stats
        function updateStats(metas, objetivos, completados) {
            document.getElementById('statMetas').textContent = metas;
            document.getElementById('statObjetivos').textContent = objetivos;
            document.getElementById('statCompletados').textContent = completados;
            
            const porcentaje = objetivos > 0 ? Math.round((completados / objetivos) * 100) : 0;
            document.getElementById('statPorcentaje').textContent = porcentaje + '%';
        }
        
        // Helper functions
        function getCategoryEmoji(category) {
            const emojis = {
                'educacion': '📚',
                'salud': '💪',
                'finanzas': '💰',
                'carrera': '🚀',
                'familia': '👨‍👩‍👧',
                'personal': '🌱',
                'hobby': '🎨',
                'otro': '⭐'
            };
            return emojis[category] || '⭐';
        }
        
        function getCategoryName(category) {
            const names = {
                'educacion': 'Educación',
                'salud': 'Salud',
                'finanzas': 'Finanzas',
                'carrera': 'Carrera',
                'familia': 'Familia',
                'personal': 'Personal',
                'hobby': 'Hobbies',
                'otro': 'Otro'
            };
            return names[category] || 'Otro';
        }
        
        // Action functions
        function registrarProgreso() {
            alert('📝 Próximamente: Pantalla de registro de progreso diario.\n\nAquí podrás marcar qué objetivos cumpliste hoy.');
        }
        
        function verReporte() {
            alert('📊 Próximamente: Vista detallada de tu progreso semanal y mensual.');
        }
        
        function configurarMetas() {
            window.location.href = 'configuracion-metas.html';
        }
    </script>
</body>
</html>
