<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F172A">
    <title>Registro - All In One Grow</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <style>
        :root {
            --color-dark: #0F172A;
            --color-darker: #020617;
            --color-primary: #3B82F6;
            --color-primary-light: #60A5FA;
            --color-accent: #10B981;
            --color-accent-glow: #34D399;
            --color-text: #E2E8F0;
            --color-text-dim: #94A3B8;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Work Sans', sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--color-darker);
            color: var(--color-text);
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%

;
            z-index: -1;
            background: linear-gradient(135deg, var(--color-darker) 0%, var(--color-dark) 50%, #1E293B 100%);
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            padding: 2rem 0;
        }
        
        .logo {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        
        .subtitle {
            color: var(--color-text-dim);
            font-size: 1.1rem;
        }
        
        .form-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 24px;
            padding: 3rem;
            margin-top: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            color: var(--color-text);
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        .required {
            color: var(--color-accent);
        }
        
        .form-input, .form-select {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: rgba(15, 23, 42, 0.8);
        }
        
        .form-hint {
            color: var(--color-text-dim);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--color-primary-light);
            margin: 2rem 0 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            margin-bottom: 0.75rem;
        }
        
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--color-text);
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(148, 163, 184, 0.3);
            transition: 0.4s;
            border-radius: 26px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        
        .btn {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.6);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--color-text-dim);
        }
        
        .login-link a {
            color: var(--color-primary-light);
            text-decoration: none;
            font-weight: 600;
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            .form-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animated"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="logo">ALL IN ONE GROW</h1>
            <p class="subtitle">Crea tu cuenta y comienza tu transformación</p>
        </div>
        
        <div class="form-card">
            <form id="registroForm" onsubmit="handleSubmit(event)">
                
                <!-- Nombre Completo -->
                <div class="form-group">
                    <label class="form-label">
                        Nombre Completo <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        class="form-input" 
                        id="nombreCompleto"
                        placeholder="Ej: Juan Pérez"
                        required
                    >
                </div>
                
                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">
                        Email <span class="required">*</span>
                    </label>
                    <input 
                        type="email" 
                        class="form-input" 
                        id="email"
                        placeholder="tu@email.com"
                        required
                    >
                </div>
                
                <!-- Contraseña -->
                <div class="form-group">
                    <label class="form-label">
                        Contraseña <span class="required">*</span>
                    </label>
                    <input 
                        type="password" 
                        class="form-input" 
                        id="password"
                        placeholder="Mínimo 6 caracteres"
                        required
                        minlength="6"
                    >
                    <p class="form-hint">Elige una contraseña segura que recuerdes</p>
                </div>
                
                <!-- Confirmar Contraseña -->
                <div class="form-group">
                    <label class="form-label">
                        Confirmar Contraseña <span class="required">*</span>
                    </label>
                    <input 
                        type="password" 
                        class="form-input" 
                        id="confirmPassword"
                        placeholder="Repite tu contraseña"
                        required
                        minlength="6"
                    >
                    <p class="form-hint">Debe coincidir con la contraseña anterior</p>
                </div>
                
                <!-- Zona Horaria -->
                <div class="form-group">
                    <label class="form-label">
                        Zona Horaria <span class="required">*</span>
                    </label>
                    <select class="form-select" id="zonaHoraria" required>
                        <option value="America/Guayaquil">Ecuador (GMT-5)</option>
                        <option value="America/Bogota">Colombia (GMT-5)</option>
                        <option value="America/Lima">Perú (GMT-5)</option>
                        <option value="America/Mexico_City">México (GMT-6)</option>
                        <option value="America/Argentina/Buenos_Aires">Argentina (GMT-3)</option>
                        <option value="America/Santiago">Chile (GMT-3)</option>
                        <option value="America/Caracas">Venezuela (GMT-4)</option>
                        <option value="Europe/Madrid">España (GMT+1)</option>
                        <option value="America/New_York">USA Este (GMT-5)</option>
                    </select>
                </div>
                
                <!-- Notificaciones -->
                <h3 class="section-title">🔔 Configurar Notificaciones</h3>
                <p class="form-hint" style="margin-bottom: 1rem;">Elige cuándo quieres recibir recordatorios diarios</p>
                
                <div class="toggle-container">
                    <label class="toggle-label">
                        <span>🌅 5:00 AM - Buenos días + Frase</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notif_5am" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="toggle-container">
                    <label class="toggle-label">
                        <span>☕ 8:00 AM - Objetivos matutinos</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notif_8am" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="toggle-container">
                    <label class="toggle-label">
                        <span>🌤️ 11:00 AM - Check-in medio día</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notif_11am" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="toggle-container">
                    <label class="toggle-label">
                        <span>🍽️ 2:00 PM - Recordatorio post-almuerzo</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notif_2pm" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="toggle-container">
                    <label class="toggle-label">
                        <span>🌆 5:00 PM - Empuje final del día</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notif_5pm" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="toggle-container">
                    <label class="toggle-label">
                        <span>🌃 8:00 PM - Preparación para cierre</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notif_8pm" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="toggle-container">
                    <label class="toggle-label">
                        <span>🌙 9:00 PM - Reporte diario (Importante)</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notif_9pm" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Comenzar Mi Viaje →
                </button>
                
                <div class="login-link">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwuSntFBL1Fm0iySQs-yYqN9oIu7WWYeng2Qm3ZJMG6m4FJRF4jm3UpF2HASIoNriG35g/exec';
        
        async function handleSubmit(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registrando...';
            
            try {
                // Validar contraseñas
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                if (password !== confirmPassword) {
                    alert('❌ Las contraseñas no coinciden. Por favor verifica.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Comenzar Mi Viaje →';
                    return;
                }
                
                if (password.length < 6) {
                    alert('❌ La contraseña debe tener al menos 6 caracteres.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Comenzar Mi Viaje →';
                    return;
                }
                
                const formData = {
                    action: 'registrarUsuario',
                    nombreCompleto: document.getElementById('nombreCompleto').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    password: password,
                    zonaHoraria: document.getElementById('zonaHoraria').value,
                    notificaciones: {
                        notif_5am: document.getElementById('notif_5am').checked,
                        notif_8am: document.getElementById('notif_8am').checked,
                        notif_11am: document.getElementById('notif_11am').checked,
                        notif_2pm: document.getElementById('notif_2pm').checked,
                        notif_5pm: document.getElementById('notif_5pm').checked,
                        notif_8pm: document.getElementById('notif_8pm').checked,
                        notif_9pm: document.getElementById('notif_9pm').checked
                    }
                };
                
                // Enviar a Google Sheets
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Guardar en localStorage
                    localStorage.setItem('aio_userId', data.userId);
                    localStorage.setItem('aio_userName', formData.nombreCompleto);
                    localStorage.setItem('aio_userEmail', formData.email);
                    localStorage.setItem('aio_isLoggedIn', 'true');
                    
                    // Mostrar mensaje de éxito
                    alert(`✅ ¡Bienvenido, ${formData.nombreCompleto.split(' ')[0]}!

✅ Registro completado
✅ ID de usuario: ${data.userId}
✅ Notificaciones configuradas

Siguiente paso: Define tus metas anuales.`);
                    
                    // Redirigir a configuración de metas
                    window.location.href = 'configuracion-metas.html';
                    
                } else {
                    alert('❌ Error: ' + data.message);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Comenzar Mi Viaje →';
                }
                
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error al registrar. Por favor intenta nuevamente.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Comenzar Mi Viaje →';
            }
        }
    </script>
    
    <!-- PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registrado'))
                    .catch(err => console.log('Error:', err));
            });
        }
    </script>
</body>
</html>
